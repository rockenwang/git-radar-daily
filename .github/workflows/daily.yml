name: 每日 Git 副业雷达

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install --quiet requests

      - name: 拉取夜秣雷达技能
        run: |
          curl -fsSL "https://api.skillhub.cn/api/v1/download?slug=yemo-git-radar&namespace=indiv-yemo" -o skill.zip
          unzip -q skill.zip -d skill
          echo "技能文件数：$(find skill -type f | wc -l)"

      - name: 恢复历史账本
        run: |
          if [ -d radar-data ]; then
            cp -r radar-data/. skill/data/
            echo "已恢复 $(find skill/data -name '*.json' | wc -l) 个数据文件"
          else
            echo "首次运行，无历史数据"
          fi

      - name: 抓取并生成报告
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python skill/scripts/radar.py run --out reports

      - name: 免费机翻补全
        continue-on-error: true
        run: python scripts/auto_translate.py skill --out reports

      - name: 保存历史账本
        run: |
          mkdir -p radar-data
          rm -rf skill/data/reports skill/data/todo_translate.json
          cp -r skill/data/. radar-data/

      - name: 生成归档页面
        run: |
          python scripts/build_index.py --reports reports --data radar-data --out docs
          echo "共 $(ls docs/*.html | wc -l) 个页面"

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "今日无变化"
          else
            git commit -m "chore: $(date -u +%F) 雷达报告"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/upload-artifact@v4
        with:
          name: radar-report
          path: reports/*.html
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
